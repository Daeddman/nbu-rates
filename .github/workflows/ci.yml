name: build-and-test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore NbuRates.sln
      - run: dotnet build NbuRates.sln --no-restore -c Release
      - run: dotnet test NbuRates.sln --no-build -c Release --logger "console;verbosity=normal"
